services:
  # Database
  db:
    image: postgres:15-alpine
    container_name: bakery-db
    restart: always
    environment:
      - POSTGRES_USER=${DB_USER:-postgres}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-postgres}
      - POSTGRES_DB=${DB_NAME:-bakery_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./server/db/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend Server
  server:
    build: ./server
    container_name: bakery-api
    restart: always
    env_file:
      - ./server/.env
    environment:
      - PORT=3000
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-bakery_db}
      - JWT_SECRET=${JWT_SECRET:-your_super_secret_key_change_me}
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Frontend Client
  client:
    build: 
      context: ./client
      args:
        - VITE_API_URL=${VITE_API_URL:-http://localhost:3000/api}
    container_name: bakery-web
    restart: always
    ports:
      - "8080:80"
    depends_on:
      - server
    networks:
      - backend

  # Database UI
  adminer:
    image: adminer
    container_name: bakery-adminer
    restart: always
    ports:
      - "8085:8080"
    depends_on:
      - db
    networks:
      - backend

networks:
  backend:
    driver: bridge

volumes:
  postgres_data:
